<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal expense tracker" />
  <meta name="app-build" content="2026-04-14-v8" />
  <title>Expense Manager</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Minimal auth/overlay/toast styles -->
  <link rel="stylesheet" href="css/styles.css?v=7" />
</head>
<body>

  <!-- AUTH GATE — managed by auth.js, not React -->
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <h1 class="auth-brand-title">Expense Manager</h1>
      <p class="auth-brand-subtitle">Personal finance tracker</p>
      <div class="auth-divider"></div>
      <p class="auth-instruction">Sign in to continue</p>
      <div id="gsi-button"></div>
      <p class="auth-footer">Access restricted to authorized users</p>
    </div>
  </div>

  <!-- LOADING OVERLAY — React shows/hides via setLoadingOverlay() -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </div>

  <!-- TOAST — auth.js handleUnauthorized writes here directly -->
  <div id="toast" class="toast"></div>

  <!-- REACT MOUNT POINT -->
  <div id="app-root"></div>

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- App config (sets window.EXPENSE_SUPABASE_*) -->
  <script src="js/deployment-config.js?v=7"></script>

  <!-- Auth module (UNCHANGED — calls window.initializeAppAfterAuth / loadHomeData / resetAppInitialization) -->
  <script src="js/auth.js?v=7"></script>

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Standalone — transpiles JSX in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React app (JSX) -->
  <script type="text/babel" src="js/app.js?v=34"></script>

</body>
</html>
